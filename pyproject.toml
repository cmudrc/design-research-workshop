[build-system]
requires = ["setuptools>=82,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "design-research-workshop"
version = "0.2.0.dev0"
description = "Reproducible workshop demos for the Design Research Collective Python ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "The Design Research Collective"}]
dependencies = ["design-research==0.5.0"]

[project.optional-dependencies]
notebooks = ["ipykernel>=6,<8", "nbclient>=0.10,<1"]

[project.scripts]
design-research-workshop-proxy = "design_research_workshop.server:main"

[project.urls]
Repository = "https://github.com/cmudrc/design-research-workshop"
